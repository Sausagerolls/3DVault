name: 3DVault
options:
  bundleIdPrefix: com.3dvault
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  VaultKit:
    path: ../VaultKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team ID here (or in Xcode > Signing) for signed/notarised builds.
    DEVELOPMENT_TEAM: ""
targets:
  3DVault:
    type: application
    platform: macOS
    sources:
      - App
      - ../Shared
    dependencies:
      - package: VaultKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 3DVault
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # Home servers are usually plain HTTP on the LAN or tailnet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 3DVault connects to your 3DVault server on the local network.
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3D Print File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions: [stl, 3mf, obj, ply, step, stp, gcode, bgcode, ufp, zip]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.3dvault.mac
        PRODUCT_NAME: 3DVault
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
